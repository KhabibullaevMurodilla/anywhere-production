name: Daily Deal Finder + Blog

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pandas scikit-learn

      - name: Run deal finder
        env:
          TRAVELPAYOUTS_API_TOKEN: ${{ secrets.TRAVELPAYOUTS_API_TOKEN }}
        run: python deal_finder.py

      - name: Generate blog posts from today's real deals
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p blog
          python generate_blog_posts.py

      - name: Commit updated results back to the repo
        run: |
          git config --global user.name "deal-finder-bot"
          git config --global user.email "actions@github.com"
          git add price_history.csv todays_deals.json telegram_post.txt destinations_tracking.json 2>/dev/null || true
          git add blog/ 2>/dev/null || true
          git commit -m "Update deal data and blog posts $(date -u +'%Y-%m-%d')" || echo "Nothing to commit"
          git push
